<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administration — Musiques</title>
  <link rel="icon" href="/public/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="mise-en-page">
    <aside id="entete" class="barre-laterale"></aside>

    <main class="page">
      <h1 class="page-title">Gestion des musiques</h1>

      <section class="section">
        <h2 class="section-title">Ajouter une musique</h2>
        <form id="formulaire-musique" class="formulaire formulaire-large">
          <div>
            <label for="musique-titre" class="champ">Titre</label>
            <input id="musique-titre" type="text" required class="saisie" />
          </div>
          <div>
            <label for="musique-chant" class="champ">Chant associé (optionnel)</label>
            <select id="musique-chant" class="saisie">
              <option value="">—</option>
            </select>
          </div>
          <div>
            <label for="musique-fichier" class="champ">Fichier audio</label>
            <input id="musique-fichier" type="file" accept="audio/*" required class="saisie" />
          </div>
          <p id="message-erreur" class="erreur" hidden></p>
          <button type="submit" id="bouton-ajouter" class="bouton">Ajouter</button>
        </form>
      </section>

      <section class="section">
        <h2 class="section-title">Musiques existantes</h2>
        <table class="tableau">
          <thead>
            <tr>
              <th>Titre</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corps-tableau-musiques"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-musiques.js"></script>
</body>
</html>
