<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un compte — Chorale Saint Patrick</title>
  <link rel="icon" href="/public/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="entete" class="entete"></header>

  <main class="page">
    <h1 class="page-title">Créer un compte</h1>

    <form id="formulaire-inscription" class="formulaire">
      <div>
        <label for="prenom" class="champ">Prénom</label>
        <input id="prenom" type="text" required class="saisie" />
      </div>
      <div>
        <label for="nom" class="champ">Nom</label>
        <input id="nom" type="text" required class="saisie" />
      </div>
      <div>
        <label for="email" class="champ">Email</label>
        <input id="email" type="email" required class="saisie" />
      </div>
      <div>
        <label for="mot-de-passe" class="champ">Mot de passe</label>
        <input id="mot-de-passe" type="password" required minlength="6" class="saisie" />
      </div>
      <p id="message-erreur" class="erreur" hidden></p>
      <p id="message-info" class="info" hidden></p>
      <button type="submit" id="bouton-inscription" class="bouton">Créer mon compte</button>
    </form>

    <p class="lien-secondaire">
      Déjà un compte ? <a href="/connexion.html">Se connecter</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/page-inscription.js"></script>
</body>
</html>
