<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Répertoire — Chorale Saint Patrick</title>
  <link rel="icon" href="/public/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="mise-en-page">
    <aside id="entete" class="barre-laterale"></aside>

    <main class="page">
      <h1 class="page-title">Répertoire</h1>

      <div class="onglets">
        <button class="onglet actif" data-onglet="chants" type="button">Chants</button>
        <button class="onglet" data-onglet="partitions" type="button">Partitions</button>
        <button class="onglet" data-onglet="musiques" type="button">Musiques</button>
        <button class="onglet" data-onglet="photos" type="button">Photos</button>
      </div>

      <div class="onglet-panneau actif" id="panneau-chants">
        <div id="groupes-chants"></div>
      </div>

      <div class="onglet-panneau" id="panneau-partitions">
        <ul class="liste" id="liste-partitions"></ul>
      </div>

      <div class="onglet-panneau" id="panneau-musiques">
        <ul class="liste" id="liste-musiques"></ul>
      </div>

      <div class="onglet-panneau" id="panneau-photos">
        <div class="grille-photos-admin" id="galerie-photos"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/page-repertoire.js"></script>
</body>
</html>
